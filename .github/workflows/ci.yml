name: CI

on:
  pull_request:
    branches: [main]

# Least privilege: the checks only read the code.
permissions:
  contents: read

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (exact versions from the lockfile)
        run: npm ci

      # `npm run build` type-checks (tsc --noEmit) and then builds with Vite, so a type error fails the check.
      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test
