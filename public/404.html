<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Kone Tshivhinda</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05060d" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Self-contained on purpose: this page is served for any missing path, at any depth. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
        background: #05060d;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        color: #cbd5e1;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background:
          radial-gradient(60rem 36rem at 12% -10%, rgb(34 211 238 / 0.2), transparent 60%),
          radial-gradient(56rem 34rem at 95% 0%, rgb(244 114 182 / 0.16), transparent 60%),
          radial-gradient(50rem 30rem at 50% 115%, rgb(139 92 246 / 0.22), transparent 60%), #05060d;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(rgb(255 255 255 / 0.04) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, #000 20%, transparent 75%);
        mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, #000 20%, transparent 75%);
      }
      main {
        position: relative;
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0;
        font: 500 0.75rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #67e8f9;
      }
      .eyebrow i {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #f472b6;
        box-shadow: 0 0 12px #f472b6;
      }
      .code {
        margin: 1rem 0 0;
        font-size: clamp(6rem, 28vw, 10rem);
        line-height: 0.95;
        font-weight: 800;
        letter-spacing: -0.05em;
        color: #e9edf8;
        background: linear-gradient(100deg, #22d3ee 0%, #8b5cf6 52%, #f472b6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.5rem;
        line-height: 1.3;
        color: #e9edf8;
      }
      p {
        margin: 0.75rem 0 0;
      }
      .eyebrow {
        margin: 0;
      }
      code {
        padding: 0.1rem 0.45rem;
        border-radius: 0.4rem;
        border: 1px solid rgb(255 255 255 / 0.12);
        background: rgb(12 16 36 / 0.8);
        color: #a5f3fc;
        font: 0.875em ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1.4rem;
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      }
      .btn-primary {
        color: #05060d;
        background: linear-gradient(100deg, #22d3ee 0%, #8b5cf6 52%, #f472b6 100%);
        box-shadow: 0 10px 34px -12px rgb(139 92 246 / 0.9);
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 40px -12px rgb(139 92 246 / 1);
      }
      .btn-ghost {
        color: #e9edf8;
        border: 1px solid rgb(255 255 255 / 0.18);
        background: rgb(255 255 255 / 0.03);
      }
      .btn-ghost:hover {
        background: rgb(255 255 255 / 0.09);
      }
      .btn:focus-visible {
        outline: 2px solid #67e8f9;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
        .btn-primary:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow"><i aria-hidden="true"></i>Error 404 / route not found</p>
      <p class="code" aria-hidden="true">404</p>
      <h1>This page does not exist</h1>
      <p>Nothing lives at <code id="missing">this address</code>. The whole portfolio is a single page, so the quickest way back is the top.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to the portfolio</a>
        <a class="btn btn-ghost" href="/#work">See the work</a>
      </div>
    </main>
    <script>
      try {
        var el = document.getElementById("missing")
        if (el && location.pathname.length > 1) el.textContent = location.pathname.slice(0, 80)
      } catch (e) {}
    </script>
  </body>
</html>
